# Apache virtual host for https://code.denniswu.org/
# Install: see deploy/README.md. certbot adds the :443 host and the HTTP -> HTTPS redirect.
<VirtualHost *:80>
    ServerName code.denniswu.org
    DocumentRoot /var/www/code.denniswu.org/public

    <Directory /var/www/code.denniswu.org/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # Until code.denniswu.org has its own front page, send the root to this project.
    RedirectMatch 302 ^/$ /hkperf-venue-seats/

    AddDefaultCharset utf-8
    AddType application/json .json

    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options "nosniff"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
        # The pages use inline script and style and fetch only their own data.
        Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'self'; frame-ancestors 'none'"
        <FilesMatch "\.(json|js|html)$">
            Header set Cache-Control "max-age=3600"
        </FilesMatch>
    </IfModule>

    ErrorLog ${APACHE_LOG_DIR}/code.denniswu.org-error.log
    CustomLog ${APACHE_LOG_DIR}/code.denniswu.org-access.log combined
</VirtualHost>
