# Apache virtual host for https://stats.denniswu.org/: the site's own GoatCounter, proxied to localhost.
# Install: see deploy/goatcounter/README.md. certbot adds the :443 host and the HTTP -> HTTPS redirect.
<VirtualHost *:80>
    ServerName stats.denniswu.org

    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:8081/
    ProxyPassReverse / http://127.0.0.1:8081/
    RequestHeader set X-Forwarded-Proto "https"

    # Keep no visitor IP addresses in Apache's own logs for this host.
    LogFormat "- %l %u %t \"%r\" %>s %b" noip
    ErrorLogFormat "[%t] [%-m:%l] %M"
    ErrorLog ${APACHE_LOG_DIR}/stats.denniswu.org-error.log
    CustomLog ${APACHE_LOG_DIR}/stats.denniswu.org-access.log noip
</VirtualHost>
